diagnosticar:
  description: >
    Estudante {student_id}: "{student_question}"
    Conteúdo: {subject}; contexto cotidiano: {everyday_context}.
    Pré-análise reflexa: {reflex_analysis}
    Exemplos sintéticos: {eja_fewshot_examples}
    Use os exemplos apenas como referência de estilo; não reutilize seus dados
    ou cenários. Faça um diagnóstico independente da mensagem atual.

    Investigue antes de decidir:
    1. Use consultar_perfil_estudante com "{student_id}" para verificar histórico,
       dificuldades e tentativas anteriores.
    2. Use consultar_conteudo_eja para identificar tópico, erros comuns e orientação.
       Baseie fatos sobre materiais nas FAQs. Se houver ambiguidade, peça um detalhe;
       sem correspondência ou conteúdo disponível, não invente.
    3. Use calculadora para conferir a resposta correta e as contas do estudante;
       não calcule de cabeça.
    4. Use detectar_emocao com "{student_id}" e a mensagem. Copie emocao_principal
       para emocao e sinal_pedagogico para sinal_pedagogico. São estimativas, não
       diagnósticos psicológicos. Se houver erro, use emocao=null e sinal neutro.

    Escolha uma proxima_acao:
    - fazer_pergunta: ainda não há tentativa suficiente.
    - dar_dica: houve erro, bloqueio ou dificuldade recorrente; prefira essa ação
      quando frustração ou desânimo se repetirem.
    - validar_e_avancar: raciocínio correto, mas incompleto.
    - propor_exercicio: resposta correta; proponha prática do mesmo tópico.
    Use o reflexo como contexto, não como decisão: proxima_acao é sua decisão
    pedagógica.
  expected_output: >
    Diagnóstico estruturado com tópico, conceitos dominados, dificuldade principal,
    raciocínio correto (ou null se não houve tentativa), resposta esperada conferida
    pela calculadora, proxima_acao, justificativa, emoção (ou null) e sinal pedagógico.
  agent: diagnosticador

orientar:
  description: >
    Mensagem: "{student_question}"
    Conteúdo: {subject}; contexto cotidiano: {everyday_context}.
    Pergunta-guia reflexa: {reflex_analysis}
    Resposta reflexa ainda não exibida: "{reflex_response}"

    Execute a proxima_acao do diagnóstico anterior, usando o sinal pedagógico para
    adaptar o acolhimento sem nomear a emoção:
    - fazer_pergunta: se necessário, explique a ideia básica e pergunte o primeiro passo.
    - dar_dica: dê uma pista concreta e parcial sobre a dificuldade e pergunte como seguir.
    - validar_e_avancar: reconheça o que está correto e pergunte o próximo passo.
    - propor_exercicio: proponha prática nova do tópico, buscando-a em consultar_conteudo_eja.

    Use apenas fatos do enunciado, diagnóstico e FAQs; diante de ambiguidade, pergunte
    em vez de supor. Preserve as relações e os valores do problema. Reconheça a tentativa
    específica, conecte-a ao contexto cotidiano e incorpore a mensagem reflexa no máximo
    uma vez. Responda em português brasileiro, em até 5 frases. Não revele a resposta
    final nem resolva o exercício; trabalhe uma ideia por turno e termine com pergunta
    orientadora (ou com o novo exercício proposto).
  expected_output: >
    Mensagem breve e empática para um estudante adulto da EJA, executando a ação do
    diagnóstico sem entregar a resposta final.
  agent: tutor
  context:
    - diagnosticar

revisar:
  description: >
    Revise a mensagem do tutor comparando-a com a resposta_esperada e o diagnóstico.
    Garanta que ela não revele a resposta nem resolva a conta, seja respeitosa e breve,
    termine com uma pergunta orientadora e não contradiga nem invente fatos ou relações.
    Se falhar em algum critério, reescreva; caso contrário, mantenha.
  expected_output: >
    Mensagem final para o estudante, com indicação de vazamento da resposta e ajustes feitos.
  agent: revisor
  context:
    - diagnosticar
    - orientar
