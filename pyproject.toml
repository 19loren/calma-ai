[project]
name = "calma-ai"
version = "0.1.0"
requires-python = ">=3.10, <3.12"
dependencies = [
    "crewai[google-genai]>=1.15.33",
    "datasets>=5.2.0",
    "langchain-community==0.3.31",
    "langchain-google-vertexai>=3.2.5",
    "langchain-ollama>=1.1.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.0.0",
    "ragas>=0.4.3",
]

[project.scripts]
calma_ai = "calma_ai.main:run"
run_crew = "calma_ai.main:run"
reflexo = "calma_ai.reflexo:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calma_ai"]

[tool.crewai]
type = "crew"
project_id = "f95374c7-dd91-4f35-b526-01f6e669e1f0"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
