name: Testar e Sincronizar Calma AI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" pytest
      - run: pytest
      - run: python scripts/sincronizar_conteudo.py --dry-run